service: alea
image: dreggdwarf/alea

servers:
  web:
    hosts:
      - 217.69.13.112

proxy:
  ssl: true
  host: alea.robin-borg.dev
  app_port: 3000

registry:
  server: ghcr.io
  username: DrEggdwarf
  password:
    - KAMAL_REGISTRY_PASSWORD

# Web stateless. Se connecte aux accessoires EXISTANTS (alea-db Postgres,
# alea-redis) sur le réseau `kamal` — on ne les kamalise pas ici pour ne pas
# toucher à la data Postgres (volume alea-pgdata). Accessories possibles plus tard.
env:
  clear:
    RAILS_ENV: production
    REDIS_URL: redis://alea-redis:6379/0
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL

# SSH sur 2022 (22 = honeypot Cowrie).
ssh:
  port: 2022

# Build local sur le runner GitHub Actions (amd64).
builder:
  arch: amd64
